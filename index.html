  <!-- ===== Custom Styles ===== -->
  <style>
    /* Smooth scroll */
    html {
      scroll-behavior: smooth;
    }

    /* Selection */
    ::selection {
      background-color: #C4956A;
      color: #FFFCF8;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #FDF8F3;
    }
    ::-webkit-scrollbar-thumb {
      background: #D4BCA0;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #B89880;
    }

    /* Hero gradient overlay */
    .hero-overlay {
      background: linear-gradient(
        90deg,
        rgba(44, 24, 16, 0.75) 0%,
        rgba(44, 24, 16, 0.40) 50%,
        rgba(44, 24, 16, 0.10) 100%
      );
    }

    /* Card hover effect */
    .service-card {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .service-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(196, 149, 106, 0.15);
    }

    /* Button hover */
    .btn-honey {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-honey:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(196, 149, 106, 0.30);
    }

    /* Stagger animation */
    .stagger-in > * {
      opacity: 0;
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .stagger-in > *:nth-child(1) { animation-delay: 0.1s; }
    .stagger-in > *:nth-child(2) { animation-delay: 0.2s; }
    .stagger-in > *:nth-child(3) { animation-delay: 0.3s; }
    .stagger-in > *:nth-child(4) { animation-delay: 0.4s; }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Floating animation for subtle micro-motion */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .float-slow {
      animation: float 6s ease-in-out infinite;
    }

    /* Section divider */
    .section-divider {
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        #E8D5C4 20%,
        #E8D5C4 80%,
        transparent 100%
      );
    }

    /* Form focus */
    .form-input:focus {
      border-color: #C4956A;
      box-shadow: 0 0 0 3px rgba(196, 149, 106, 0.15);
      outline: none;
    }

    /* Mobile nav */
    .mobile-menu-enter {
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .mobile-menu-exit {
      animation: slideOut 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(100%); opacity: 0; }
    }

    /* Decorative honeycomb pattern */
    .honeycomb-bg {
      background-image: 
        radial-gradient(circle at 25% 25%, rgba(196, 149, 106, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(122, 155, 122, 0.04) 0%, transparent 50%);
    }

    /* Testimonial card */
    .testimonial-card {
      border-left: 3px solid #C4956A;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .testimonial-card:hover {
      border-left-color: #7A9B7A;
      background: #FDF8F3;
    }

    /* Service area map placeholder */
    .map-placeholder {
      background: linear-gradient(135deg, #F5EDE0 0%, #E8D5C4 100%);
    }
  </style>
